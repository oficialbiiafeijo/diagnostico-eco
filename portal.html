<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal do cliente · Grupo B3 Sales</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  body{background:var(--creme)}

  /* ---------------------------------------------------------- casca ---- */
  .pf-app{min-height:100vh;display:flex}
  .pf-side{width:264px;flex:none;background:linear-gradient(180deg,var(--ameixa-800),var(--ameixa-900) 70%);
    color:#fff;padding:26px 18px 20px;position:fixed;inset:0 auto 0 0;overflow-y:auto;z-index:5}
  .pf-logo{padding:6px 8px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:18px}
  .pf-logo .marca-b3 .mb,.pf-logo .marca-b3 .m3{fill:#FFFCF9}
  .pf-logo .marca-b3 .m3{fill:var(--ouro-300)}
  .pf-logo .marca-fio{background:var(--ouro-300);opacity:.55}
  .pf-logo .marca-txt{color:#fff}
  .pf-logo .marca-sub{color:var(--ouro-300)}
  .pf-logo .marca-img{max-height:34px;background:var(--branco);border-radius:8px;padding:4px 8px}
  .pf-eyebrow-side{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(255,255,255,.42);padding:0 8px;margin-bottom:10px}
  .pf-nav{display:grid;gap:5px}
  .pf-nav button{width:100%;text-align:left;background:transparent;border:none;color:#d9cbdc;
    border-radius:12px;padding:12px 13px;display:flex;align-items:center;gap:12px;
    font-family:var(--sans);font-size:13.5px;cursor:pointer;transition:.16s}
  .pf-nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .pf-nav button.at{background:rgba(255,255,255,.12);color:#fff}
  .pf-nav .ico{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.07);
    border:1px solid rgba(230,203,152,.18);display:flex;align-items:center;justify-content:center;
    font-size:14px;flex:none;color:var(--ouro-300)}
  .pf-nav button.at .ico{background:linear-gradient(140deg,var(--ouro-500),var(--ouro-800));
    color:#2A1733;border-color:transparent}
  .pf-side-baixo{margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
  .pf-quem{display:flex;align-items:center;gap:10px;padding:6px 8px}
  .pf-quem-av{width:36px;height:36px;border-radius:11px;flex:none;background-size:cover;
    background-position:center;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:16px;color:#fff;background-color:rgba(255,255,255,.14);
    border:1px solid rgba(230,203,152,.3)}
  .pf-quem strong{display:block;font-size:12.5px;color:#fff;font-weight:500;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pf-quem span{font-size:11px;color:rgba(255,255,255,.5)}

  .pf-main{margin-left:264px;width:calc(100% - 264px);min-height:100vh}
  .pf-topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:20px 34px;position:sticky;top:0;background:rgba(250,243,236,.88);
    backdrop-filter:blur(6px);z-index:4;border-bottom:1px solid var(--linha)}
  .pf-crumb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .pf-crumb b{color:var(--ameixa-800)}
  .pf-top-acoes{display:flex;align-items:center;gap:10px}
  .pf-sino{width:38px;height:38px;border-radius:12px;border:1px solid var(--linha-2);
    background:var(--branco);display:flex;align-items:center;justify-content:center;
    font-size:15px;color:var(--ameixa-700);cursor:pointer;position:relative}
  .pf-palco{max-width:1080px;margin:0 auto;padding:30px 34px 90px}

  @media (max-width:920px){
    .pf-side{width:76px;padding:20px 10px}
    .pf-logo{padding:4px 4px 16px;text-align:center}
    .pf-logo .marca-txt,.pf-logo .marca-sub,.pf-logo .marca-fio,.pf-eyebrow-side,
    .pf-nav button span,.pf-quem strong,.pf-quem span{display:none}
    .pf-nav button{justify-content:center;padding:11px}
    .pf-quem{justify-content:center}
    .pf-main{margin-left:76px;width:calc(100% - 76px)}
    .pf-topbar{padding:16px 20px}
    .pf-palco{padding:22px 20px 70px}
  }

  /* --------------------------------------------------------- hero ---- */
  .pf-hero{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:22px;margin-bottom:30px}
  .pf-hero-copy{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);
    padding:38px 36px;box-shadow:var(--sombra);position:relative;overflow:hidden}
  .pf-hero-copy::after{content:"B3";position:absolute;right:-6px;bottom:-38px;
    font:150px var(--serif);color:rgba(36,16,48,.04);pointer-events:none}
  .pf-hero-copy h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,3.6vw,40px);
    line-height:1.12;color:var(--ameixa-900);margin:10px 0 0;max-width:20ch;text-wrap:balance;
    position:relative}
  .pf-hero-copy p{margin:14px 0 0;font-size:14.5px;color:var(--texto-2);max-width:52ch;
    position:relative}
  .pf-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;
    background:var(--creme-2);font-size:11px;color:var(--texto-2);border:1px solid var(--linha-2)}
  .pf-pill b{color:var(--ameixa-900)}
  .pf-pills{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px;position:relative}
  .pf-stage{background:linear-gradient(155deg,var(--ameixa-800),var(--ameixa-900));
    border-radius:var(--r);padding:26px 24px;color:#fff;display:flex;flex-direction:column;
    box-shadow:var(--sombra-lg);position:relative;overflow:hidden}
  .pf-stage::before{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;
    border:1px solid rgba(230,203,152,.2);border-radius:50%}
  .pf-stage span.tag{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ouro-300);position:relative}
  .pf-stage h3{font-family:var(--serif);font-size:24px;margin:9px 0 0;line-height:1.15;
    position:relative;font-weight:500}
  .pf-stage-linha{height:1px;background:rgba(255,255,255,.16);margin:16px 0}
  .pf-stage p{margin:0;font-size:12px;color:rgba(255,255,255,.78);line-height:1.6;position:relative}
  .pf-stage .prox{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ouro-300);margin-top:14px;position:relative}

  @media (max-width:820px){ .pf-hero{grid-template-columns:1fr} }

  /* ------------------------------------------------------- cartões ---- */
  .pf-sec{margin:38px 0 14px}
  .pf-sec .eyebrow{color:var(--ouro-700);margin-bottom:6px;display:block}
  .pf-sec h2{font-family:var(--serif);font-weight:500;font-size:27px;color:var(--ameixa-900);margin:0}

  .pf-portas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .pf-porta{position:relative;background:var(--branco);border:1px solid var(--linha);
    border-radius:var(--r);padding:22px 20px 20px;text-align:left;cursor:pointer;
    font-family:var(--sans);transition:.18s}
  .pf-porta:hover{border-color:var(--c);transform:translateY(-3px);box-shadow:var(--sombra-lg)}
  .pf-porta-i{display:flex;align-items:center;justify-content:center;width:38px;height:38px;
    border-radius:12px;font-size:16px;background:var(--creme-2);color:var(--c);margin-bottom:15px}
  .pf-porta b{display:block;font-family:var(--serif);font-size:19px;font-weight:500;
    color:var(--ameixa-900);line-height:1.22}
  .pf-porta-s{display:block;font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
  .pf-porta-seta{position:absolute;top:22px;right:18px;color:var(--c);opacity:0;
    transition:.18s;font-size:14px}
  .pf-porta:hover .pf-porta-seta{opacity:1}

  .pf-construido{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .pf-cons{background:var(--branco);border:1px solid var(--linha);border-top:2px solid var(--c);
    border-radius:0 0 var(--r-sm) var(--r-sm);padding:15px 17px;font-size:14px;
    color:var(--ameixa-900);line-height:1.45}
  .pf-cons span{display:block;width:16px;height:2px;background:var(--c);margin-bottom:9px;opacity:.55}

  .pf-atual{margin-top:34px;background:var(--creme-2);border-radius:var(--r);padding:16px 20px;
    display:flex;align-items:center;gap:14px}
  .pf-atual-i{width:28px;height:28px;border-radius:50%;flex:none;background:var(--creme-3);
    color:var(--ameixa-700);display:flex;align-items:center;justify-content:center;font-size:13px}
  .pf-atual p{margin:0;font-size:13.5px;color:var(--texto-2)}
  .pf-atual time{font-size:11.5px;color:var(--muted);white-space:nowrap;
    font-variant-numeric:lining-nums tabular-nums;margin-left:auto}

  /* -------------------------------------------------------- jornada ---- */
  .pf-journey{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);
    padding:36px 34px;box-shadow:var(--sombra);position:relative}
  .pf-journey::before{content:"";position:absolute;left:52px;top:60px;bottom:60px;width:2px;
    background:linear-gradient(var(--terracota-500),var(--linha))}
  .pf-jstep{position:relative;display:flex;gap:22px;padding:9px 0 26px;cursor:pointer;
    background:none;border:none;text-align:left;width:100%;font-family:var(--sans)}
  .pf-jstep:last-child{padding-bottom:0}
  .pf-jbullet{z-index:1;width:42px;height:42px;border-radius:50%;background:var(--creme);
    border:2px solid var(--linha-2);display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-family:var(--serif);font-size:16px;flex:none}
  .pf-jstep.feita .pf-jbullet{background:var(--terracota-500);border-color:var(--terracota-500);color:#fff}
  .pf-jstep.agora .pf-jbullet{background:var(--ameixa-900);border-color:var(--ameixa-900);
    color:var(--ouro-300);box-shadow:0 0 0 6px var(--terracota-100)}
  .pf-jbody{padding-top:2px;flex:1;min-width:0}
  .pf-jbody small{display:block;color:var(--ouro-700);text-transform:uppercase;
    letter-spacing:.14em;font-size:9.5px;margin-bottom:5px}
  .pf-jbody h3{font-family:var(--serif);font-weight:500;font-size:21px;color:var(--muted);margin:0}
  .pf-jstep.feita .pf-jbody h3,.pf-jstep.agora .pf-jbody h3{color:var(--ameixa-900)}
  .pf-jtag{align-self:center;font-size:10px;padding:7px 11px;border-radius:99px;
    background:var(--creme-2);color:var(--muted);flex:none}
  .pf-jstep.agora .pf-jtag{background:var(--terracota-100);color:var(--terracota-700)}
  .pf-jstep.feita .pf-jtag{background:var(--ouro-100);color:var(--ouro-800)}
  .pf-resultado{margin:24px 0 0;padding:18px 22px;background:var(--ouro-100);border-radius:var(--r);
    font-family:var(--serif);font-size:18px;color:var(--ouro-800);line-height:1.5}

  .pf-obj{margin:14px 0 0;padding:13px 16px;background:var(--ouro-100);
    border-left:3px solid var(--ouro-500);border-radius:0 var(--r-sm) var(--r-sm) 0;
    font-size:14px;color:var(--texto)}
  .pf-obj b{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ouro-800);margin-bottom:4px}
  .pf-entregas{margin:16px 0 0;display:flex;flex-direction:column;gap:8px}
  .pf-entrega{display:flex;align-items:flex-start;gap:10px;font-size:14.2px;
    color:var(--texto-2);line-height:1.5}
  .pf-check{width:18px;height:18px;border-radius:50%;flex:0 0 auto;margin-top:1px;
    display:flex;align-items:center;justify-content:center;font-size:10px;
    background:var(--creme-3);color:var(--muted)}
  .pf-entrega.ok .pf-check{background:var(--ok);color:#fff}
  .pf-entrega.ok{color:var(--texto)}
  .pf-pilar{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ouro-700);
    border:1px solid var(--ouro-300);border-radius:99px;padding:1px 7px;margin-left:auto;flex:0 0 auto}
  .pf-vazio{font-size:13.5px;color:var(--muted);font-style:italic}

  /* ------------------------------------------------------------ ECO ---- */
  .eco-tri .e{color:var(--ameixa-700)}
  .eco-tri .c{color:var(--terracota-600)}
  .eco-tri .o{color:var(--azul-700)}
  .pf-eco-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:6px}
  .pf-eco-c{border-radius:var(--r);min-height:250px;padding:30px 26px;color:#fff;
    position:relative;overflow:hidden}
  .pf-eco-c::after{content:"";position:absolute;width:170px;height:170px;
    border:1px solid rgba(255,255,255,.2);border-radius:50%;right:-55px;bottom:-60px}
  .pf-eco-c.e{background:linear-gradient(150deg,var(--ameixa-700),var(--ameixa-900))}
  .pf-eco-c.c{background:linear-gradient(150deg,var(--terracota-500),var(--terracota-800))}
  .pf-eco-c.o{background:linear-gradient(150deg,var(--azul-500),var(--azul-900))}
  .pf-eco-l{font-family:var(--serif);font-size:44px;color:rgba(255,255,255,.7);line-height:1;
    display:block;position:relative}
  .pf-eco-c h3{font-family:var(--serif);font-weight:500;font-size:25px;color:#fff;
    margin:16px 0 9px;position:relative}
  .pf-eco-c p{margin:0;font-size:13px;color:rgba(255,255,255,.82);line-height:1.7;
    max-width:34ch;position:relative}
  @media (max-width:820px){ .pf-eco-grid{grid-template-columns:1fr} }

  /* -------------------------------------------------------- evolução ---- */
  .pf-ribbon{margin:6px 0 26px;display:grid;grid-template-columns:1.2fr .8fr;gap:18px;
    background:linear-gradient(110deg,var(--ameixa-900),var(--azul-900));color:#fff;
    border-radius:var(--r);padding:30px 32px;position:relative;overflow:hidden;
    box-shadow:var(--sombra-lg)}
  .pf-ribbon::after{content:"";position:absolute;right:-28px;top:-60px;width:220px;height:220px;
    border:1px solid rgba(230,203,152,.3);border-radius:50%}
  .pf-ribbon h3{color:#fff;font-family:var(--serif);font-size:26px;margin:9px 0 7px;font-weight:500}
  .pf-ribbon p{font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.82);max-width:400px;margin:0}
  .pf-evo-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:center}
  .pf-evo-stat{border-left:1px solid rgba(255,255,255,.2);padding-left:14px}
  .pf-evo-stat strong{display:block;font-family:var(--serif);font-size:25px;color:var(--ouro-300)}
  .pf-evo-stat span{display:block;color:rgba(255,255,255,.8);font-size:10px;margin-top:3px}
  @media (max-width:760px){ .pf-ribbon{grid-template-columns:1fr} }

  .pf-ach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .pf-ach{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);
    padding:24px 22px;box-shadow:var(--sombra)}
  .pf-ach .selo{width:48px;height:48px;border-radius:50%;border:1px solid var(--ouro-500);
    background:var(--ouro-100);display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:18px;color:var(--ouro-800);margin-bottom:14px;position:relative}
  .pf-ach .selo::after{content:"";position:absolute;inset:4px;border-radius:50%;
    border:1px solid rgba(168,128,63,.3)}
  .pf-ach h3{font-family:var(--serif);font-weight:500;font-size:19px;color:var(--ameixa-900);margin:0}
  .pf-ach p{margin:8px 0 0;font-size:12.5px;color:var(--texto-2);line-height:1.6}
  .pf-ach time{display:block;margin-top:10px;font-size:11px;color:var(--muted);
    font-variant-numeric:lining-nums tabular-nums}
  .pf-prox-card{margin-top:16px;background:var(--creme-2);border:1px dashed var(--linha-2);
    border-radius:var(--r);padding:22px 24px;display:grid;grid-template-columns:52px minmax(0,1fr);
    gap:16px;align-items:center}
  .pf-prox-card .selo{background:transparent;border-style:dashed;border-color:var(--linha-2);
    color:var(--muted);width:52px;height:52px;margin:0}
  .pf-prox-card .selo::after{display:none}
  .pf-prox-card h3{font-family:var(--serif);font-weight:500;font-size:19px;color:var(--ameixa-800);margin:0 0 2px}
  .pf-prox-card p{margin:0;font-size:13px;color:var(--texto-2)}

  /* --------------------------------------------------- materiais ---- */
  .pf-lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .pf-res{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);
    overflow:hidden;cursor:pointer;transition:.18s;box-shadow:var(--sombra)}
  .pf-res:hover{transform:translateY(-3px);box-shadow:var(--sombra-lg)}
  .pf-res-capa{height:72px}
  .pf-res-top{padding:16px 17px 0}
  .pf-res small{color:var(--ouro-700);font-size:9px;text-transform:uppercase;letter-spacing:.15em}
  .pf-res h3{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--ameixa-900);
    margin:8px 0 0}
  .pf-res-sub{padding:0 17px 15px}
  .pf-res-sub button{display:block;width:100%;text-align:left;background:none;border:none;
    padding:6px 0;font-family:var(--sans);font-size:12.5px;color:var(--texto-2);cursor:pointer;
    border-top:1px solid var(--linha-2)}
  .pf-res-sub button:hover{color:var(--ameixa-900)}
  .pf-res-foot{padding:14px 17px 17px;font-size:12px;color:var(--muted)}
  .pf-res-play{height:72px;display:flex;align-items:center;justify-content:center}
  .pf-res-play span{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);
    color:var(--ameixa-800);display:flex;align-items:center;justify-content:center;
    font-size:12px;padding-left:2px}
  .pf-prog{height:6px;border-radius:99px;background:var(--creme-3);overflow:hidden;margin-top:9px}
  .pf-prog i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--ouro-600),var(--terracota-500))}

  /* -------------------------------------------------------- conversa ---- */
  .pf-chat{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);
    box-shadow:var(--sombra);display:flex;flex-direction:column;overflow:hidden}
  .pf-chat-hist{padding:28px 30px;max-height:520px;overflow-y:auto;display:flex;
    flex-direction:column;gap:14px}
  .pf-bubble{max-width:74%;padding:13px 17px;border-radius:16px 16px 16px 4px;
    background:var(--creme-2);color:var(--texto)}
  .pf-bubble.eu{align-self:flex-end;border-radius:16px 16px 4px 16px;
    background:linear-gradient(140deg,var(--ameixa-700),var(--ameixa-900));color:#fff}
  .pf-bubble b{display:block;font-size:11px;font-weight:600;margin-bottom:3px;
    color:var(--ouro-700)}
  .pf-bubble.eu b{color:var(--ouro-300)}
  .pf-bubble p{margin:0;font-size:14px;line-height:1.6;white-space:pre-wrap}
  .pf-bubble time{display:block;margin-top:6px;font-size:10.5px;opacity:.65;
    font-variant-numeric:lining-nums tabular-nums}
  .pf-bubble a.anexo{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12.5px;
    text-decoration:none;color:inherit;opacity:.92;border-top:1px solid rgba(0,0,0,.08);
    padding-top:7px}
  .pf-bubble.eu a.anexo{border-top-color:rgba(255,255,255,.2)}
  .pf-compose{border-top:1px solid var(--linha);padding:20px 24px;background:var(--creme-2)}
  .pf-compose input,.pf-compose textarea{width:100%;font-family:var(--sans);font-size:14px;
    padding:11px 13px;border:1px solid var(--linha-2);border-radius:10px;background:var(--branco);
    color:var(--texto);margin-bottom:10px}
  .pf-compose textarea{min-height:88px;resize:vertical}
  .pf-ax-lista{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px}
  .pf-ax-t{background:var(--branco);border:1px solid var(--linha-2);border-radius:99px;
    padding:4px 12px;font-size:11.5px;color:var(--texto-2)}
  .pf-ax-t button{background:none;border:none;cursor:pointer;color:var(--muted);
    font-size:13px;padding:0 0 0 4px}
  .pf-compose-linha{display:flex;justify-content:space-between;align-items:center;gap:10px;
    flex-wrap:wrap}

  .pf-voltar{background:none;border:none;color:var(--ameixa-700);cursor:pointer;
    font-family:var(--sans);font-size:13.5px;padding:0;margin-bottom:18px}
  .pf-erro{max-width:520px;margin:90px auto;text-align:center}
  .pf-vermelho{color:var(--critico);font-weight:500}
  .pf-men{color:var(--ameixa-700);background:var(--ouro-100);border-radius:5px;
    padding:1px 6px;font-size:.94em}
  .pf-emb{position:relative;width:100%;padding-top:56.25%;border-radius:var(--r);
    overflow:hidden;background:#000}
  .pf-emb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

  /* ---------------------------------------------------------- curso ---- */
  .pf-cur-banner{height:210px;border-radius:var(--r);display:flex;align-items:flex-end;
    position:relative;overflow:hidden;margin-bottom:20px}
  .pf-cur-banner::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 30%,rgba(20,8,28,.82))}
  .pf-cur-sobre{position:relative;z-index:1;padding:26px 30px;color:#fff}
  .pf-cur-t{font-size:36px;color:#fff;margin:4px 0 0;line-height:1.1;font-family:var(--serif)}
  .pf-cur-d{margin:8px 0 0;font-size:14.5px;color:rgba(255,255,255,.86);max-width:640px}
  .pf-prog-cx{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);
    padding:18px 20px;margin-bottom:18px}
  .pf-prog-r{display:flex;justify-content:space-between;align-items:baseline;
    font-size:13px;color:var(--texto-2);margin-bottom:9px}
  .pf-prog-r b{font-family:var(--serif);font-size:24px;color:var(--ameixa-900)}
  .pf-comecar{margin-bottom:26px}
  .pf-mod-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;
    margin:28px 0 12px}
  .pf-mod-t{font-size:22px;color:var(--ameixa-900);margin:3px 0 0;font-family:var(--serif)}
  .pf-mod-p{font-size:12px;color:var(--ouro-800);background:var(--ouro-100);border-radius:99px;
    padding:3px 11px;flex:none}
  .pf-aulas{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:13px}
  .pf-aula-c{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r-sm);
    overflow:hidden;cursor:pointer;transition:.16s}
  .pf-aula-c:hover{transform:translateY(-2px);box-shadow:var(--sombra-lg);border-color:var(--ouro-300)}
  .pf-aula-capa{height:100px;position:relative;display:flex;align-items:center;justify-content:center}
  .pf-aula-play{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);
    color:var(--ameixa-800);display:flex;align-items:center;justify-content:center;
    font-size:12px;padding-left:2px}
  .pf-aula-ok{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;
    background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}
  .pf-aula-t{padding:11px 13px;font-size:13.5px;color:var(--ameixa-900);line-height:1.4}
  .pf-play-grade{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
  .pf-player{width:100%;border-radius:var(--r);background:#000;display:block}
  .pf-semvideo{padding:60px 20px;text-align:center;background:var(--creme-2);
    border:1px dashed var(--linha-2);border-radius:var(--r);color:var(--muted);font-size:14px}
  .pf-aula-acoes{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
  .pf-aula-info{margin-top:22px;padding-top:18px;border-top:1px solid var(--linha)}
  .pf-lado{position:sticky;top:90px;display:flex;flex-direction:column;gap:11px}
  .pf-lado-mod{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r-sm);
    overflow:hidden}
  .pf-lado-cab{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--creme-2);
    font-size:12.5px;color:var(--ameixa-900)}
  .pf-lado-p{font-size:10.5px;color:var(--ouro-800);background:var(--ouro-100);border-radius:99px;
    padding:2px 8px;flex:none}
  .pf-lado-a{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;
    font-size:13px;color:var(--texto-2);border-top:1px solid var(--linha);transition:.14s}
  .pf-lado-a:hover{background:var(--creme)}
  .pf-lado-a.at{background:var(--ouro-100);color:var(--ameixa-900)}
  .pf-lado-a.vista .pf-lado-i{color:var(--ok)}
  .pf-lado-i{width:16px;text-align:center;font-size:10px;color:var(--muted);flex:none}
  @media (max-width:820px){ .pf-play-grade{grid-template-columns:1fr} .pf-lado{position:static} }
</style>
</head>
<body>
<div class="pf-app">
  <aside class="pf-side">
    <div class="pf-logo"><div class="marca"><span class="marca-b3"><svg viewBox="0 0 56 56" aria-label="B3 Sales Group"><text class="mb" x="0" y="45">B</text><text class="m3" x="13" y="41">3</text></svg></span><span class="marca-fio"></span><div>
      <div class="marca-txt">Sales</div><div class="marca-sub">Group</div></div></div></div>
    <div class="pf-eyebrow-side">Meu portal</div>
    <nav class="pf-nav" id="pfNav"></nav>
    <div class="pf-side-baixo"><div class="pf-quem" id="pfQuem"></div></div>
  </aside>
  <main class="pf-main">
    <div class="pf-topbar">
      <div class="pf-crumb">Portal do cliente <span style="color:var(--ouro-600)">/</span> <b id="pfCrumb">Visão geral</b></div>
      <div class="pf-top-acoes">
        <button class="pf-sino" title="Notificações" type="button">◔</button>
        <button class="btn btn-ameixa btn-sm" id="pfFalar">Fale com a equipe</button>
      </div>
    </div>
    <div class="pf-palco" id="palco"></div>
  </main>
</div>

<script>
(function () {
  var palco = document.getElementById("palco");
  var token = location.pathname.split("/")[2] || "";

  function el(h) { var d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstChild; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function formatar(txt) {
    var h = esc(txt);
    h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/__([^_]+)__/g, "<em>$1</em>");
    h = h.replace(/!!([^!]+)!!/g, '<span class="pf-vermelho">$1</span>');
    h = h.replace(/@\[([^\]]{1,60})\]/g, '<span class="pf-men">@$1</span>');
    return h;
  }
  function dataBr(s) {
    if (!s) return "";
    var d = new Date(s);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
  }
  function dataCurta(v) {
    if (!v) return "";
    var pp = String(v).slice(0, 10).split("-");
    if (pp.length !== 3) return v;
    var m = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
    return pp[2] + " " + (m[parseInt(pp[1], 10) - 1] || "") + " " + pp[0];
  }
  /* a palavra ECO sempre nas mesmas tres cores: roxo, laranja e azul */
  function ecoTri() {
    return '<span class="eco-tri"><span class="e">E</span><span class="c">C</span><span class="o">O</span></span>';
  }

  var CAPAS = {
    estrategia: "linear-gradient(135deg,#241030,#5A3A6E 62%,#8E6FA3)",
    conducao: "linear-gradient(135deg,#472B60,#A8803F 68%,#E6CB98)",
    operacao: "linear-gradient(135deg,#7E3A24,#C2683F 60%,#E2A183)",
    ouro: "linear-gradient(135deg,#8A6530,#CFA467 58%,#F5E9D2)",
    ameixa: "linear-gradient(135deg,#241030,#472B60 70%,#C9B4D6)",
    creme: "linear-gradient(135deg,#EDE0D6,#FAF3EC 60%,#FFFCF9)"
  };

  function estiloAvatar(d) {
    if (!d.logo_midia_id) return "background:rgba(255,255,255,.14)";
    var a = {};
    try { a = JSON.parse(d.logo_ajuste || "{}") || {}; } catch (e) { a = {}; }
    var z = a.zoom || 100, x = a.x == null ? 50 : a.x, y = a.y == null ? 50 : a.y;
    return "background-image:url(/api/midia/" + esc(d.logo_midia_id) + ");" +
      "background-size:" + z + "% auto;background-position:" + x + "% " + y + "%;" +
      "background-repeat:no-repeat;background-color:#fff";
  }

  function erro(msg) {
    palco.innerHTML = "";
    document.getElementById("pfNav").innerHTML = "";
    palco.appendChild(el('<div class="pf-erro"><h1 class="serif" style="font-size:32px;' +
      'color:var(--ameixa-900)">Acompanhamento indisponível</h1>' +
      '<p class="muted" style="margin-top:12px">' + esc(msg) + '</p></div>'));
  }

  /* ---------------------------------------------------------- casca ---- */
  var PORTAS = [
    ["inicio", "Visão geral", "▦"],
    ["jornada", "Minha jornada", "◷"],
    ["eco", "Método ECO", "◈"],
    ["evolucao", "Minha evolução", "✦"],
    ["materiais", "Materiais e treinamentos", "▤"],
    ["conversa", "Fale com a equipe", "✉"]
  ];

  function montarCasca(d) {
    var nav = document.getElementById("pfNav");
    nav.innerHTML = "";
    PORTAS.forEach(function (p) {
      var b = el('<button type="button"><i class="ico">' + p[2] + '</i><span>' +
        esc(p[1]) + '</span></button>');
      b.onclick = function () { irPara(p[0]); };
      b.setAttribute("data-rota", p[0]);
      nav.appendChild(b);
    });
    document.getElementById("pfFalar").onclick = function () { irPara("conversa"); };
    var quem = document.getElementById("pfQuem");
    quem.innerHTML = '<div class="pf-quem-av" style="' + estiloAvatar(d) + '">' +
      (d.logo_midia_id ? "" : esc((d.empresa || "?").slice(0, 1).toUpperCase())) + '</div>' +
      '<div><strong>' + esc(d.empresa) + '</strong><span>' +
      esc(d.segmento || "Cliente Grupo B3 Sales") + '</span></div>';
  }

  function marcarNavAtiva(onde) {
    document.querySelectorAll("#pfNav button").forEach(function (b) {
      b.classList.toggle("at", b.getAttribute("data-rota") === onde);
    });
    var rot = (PORTAS.filter(function (p) { return p[0] === onde; })[0] || PORTAS[0])[1];
    document.getElementById("pfCrumb").textContent = rot;
  }

  /* ------------------------------------------------------ página inicial */
  function desenhar(d) {
    palco.innerHTML = "";
    marcarNavAtiva("inicio");

    var hero = el('<div class="pf-hero"></div>');
    var copy = el('<div class="pf-hero-copy">' +
      '<div class="eyebrow" style="color:var(--terracota-600)">Grupo B3 Sales · Implementação comercial</div>' +
      '<h1>Sua empresa não precisa crescer <em class="grifo">no improviso.</em></h1>' +
      '<p>Aqui você acompanha o que está sendo construído para tornar sua operação ' +
      'mais clara, organizada e preparada para crescer.</p>' +
      '<div class="pf-pills"><span class="pf-pill">Empresa <b>' + esc(d.empresa) + '</b></span>' +
      '<span class="pf-pill">Jornada em andamento</span></div></div>');
    hero.appendChild(copy);
    var stage = el('<div class="pf-stage"><span class="tag">Momento da jornada</span>' +
      '<h3>' + esc(d.etapa_atual.nome) + '</h3><div class="pf-stage-linha"></div>' +
      '<p>' + (d.foco_atual ? esc(d.foco_atual) : "O cenário foi mapeado. Agora, transformamos " +
      "clareza em movimento.") + '</p></div>');
    if (d.proximo_passo) {
      stage.appendChild(el('<div class="prox">Próximo movimento · ' +
        esc(d.proximo_passo.titulo || "") + '</div>'));
    }
    hero.appendChild(stage);
    palco.appendChild(hero);

    var itens = d.construido || [];
    var cores = ["var(--azul-700)", "var(--terracota-600)", "var(--ameixa-700)"];
    palco.appendChild(el('<div class="pf-sec"><span class="eyebrow">' +
      (itens.length ? "O que está sendo construído" : "Sendo construído agora") +
      '</span><h2>Uma operação com clareza.</h2></div>'));
    var grade = el('<div class="pf-construido"></div>');
    (itens.length ? itens : ["O retrato completo da sua operação comercial"]).forEach(function (t, i) {
      grade.appendChild(el('<div class="pf-cons" style="--c:' + cores[i % cores.length] +
        '"><span></span>' + esc(t) + '</div>'));
    });
    palco.appendChild(grade);

    palco.appendChild(el('<div class="pf-sec"><span class="eyebrow">Acesse sua estrutura</span>' +
      '<h2>Tudo em um só lugar.</h2></div>'));
    var cores2 = { jornada: "var(--azul-700)", eco: "var(--ameixa-700)",
      evolucao: "var(--ouro-700)", materiais: "var(--terracota-600)", conversa: "var(--ameixa-600)" };
    var textos = { jornada: "Acompanhe o caminho e o momento atual da implementação.",
      eco: "Conheça os três pilares que organizam a construção da sua operação.",
      evolucao: "Reconheça as conquistas e entregas que já foram construídas.",
      materiais: "Encontre conteúdos liberados para consultar e aplicar.",
      conversa: "Envie uma mensagem, dúvida ou arquivo para a equipe." };
    var pg = el('<div class="pf-portas"></div>');
    PORTAS.filter(function (p) { return p[0] !== "inicio"; }).forEach(function (p) {
      var b = el('<button class="pf-porta" type="button" style="--c:' + cores2[p[0]] + '">' +
        '<span class="pf-porta-i">' + p[2] + '</span>' +
        '<b>' + (p[0] === "eco" ? "Método " + ecoTri() : esc(p[1])) + '</b>' +
        '<span class="pf-porta-s">' + esc(textos[p[0]]) + '</span>' +
        '<span class="pf-porta-seta">→</span></button>');
      b.onclick = function () { irPara(p[0]); };
      pg.appendChild(b);
    });
    palco.appendChild(pg);

    if (d.atualizacao) {
      palco.appendChild(el('<div class="pf-atual"><span class="pf-atual-i">◷</span>' +
        '<p><strong style="color:var(--ameixa-900)">Atualização recente</strong> · ' +
        esc(d.atualizacao.texto) + '</p><time>' + dataBr(d.atualizacao.em) + '</time></div>'));
    }
  }

  function volta(destino, rotulo) {
    var b = el('<button class="pf-voltar">← ' + esc(rotulo || "Voltar para visão geral") + '</button>');
    b.onclick = function () { irPara(destino || "inicio"); };
    return b;
  }

  function tituloPag(rotulo, titulo, apoio) {
    return el('<div class="pf-sec" style="margin-top:0"><span class="eyebrow">' + esc(rotulo) +
      '</span><h2 style="font-size:31px">' + titulo + '</h2>' +
      (apoio ? '<p class="muted" style="margin:9px 0 0;font-size:14.5px;max-width:60ch">' +
        esc(apoio) + '</p>' : '') + '</div>');
  }

  function irPara(onde, arg) {
    ONDE = onde;
    palco.innerHTML = "";
    marcarNavAtiva(onde === "mes" || onde === "curso" || onde === "aula" ? "jornada" : onde);
    if (onde === "inicio") return desenhar(DADOS);
    palco.appendChild(volta());
    if (onde === "jornada") return telaJornada(DADOS);
    if (onde === "eco") return telaEco(DADOS);
    if (onde === "evolucao") return telaEvolucao(DADOS);
    if (onde === "materiais") return telaMateriais(DADOS);
    if (onde === "conversa") return telaConversa(DADOS);
    if (onde === "mes") return telaMes(DADOS, arg);
    window.scrollTo(0, 0);
  }

  function telaJornada(d) {
    palco.appendChild(tituloPag("Minha jornada", 'A sua <em class="grifo">jornada</em>',
      "Uma implementação construída etapa por etapa, de acordo com as prioridades da sua operação."));
    var jor = el('<div class="pf-journey"></div>');
    (d.etapas || []).forEach(function (e) {
      var cls = e.situacao === "Concluída" ? "feita" : e.situacao === "Em andamento" ? "agora" : "";
      var it = el('<button class="pf-jstep ' + cls + '" type="button">' +
        '<span class="pf-jbullet">' + (cls === "feita" ? "✓" : "") + '</span>' +
        '<div class="pf-jbody"><small>' + esc(e.situacao) + '</small><h3>' + esc(e.nome) +
        '</h3></div><span class="pf-jtag">→</span></button>');
      it.onclick = function () { irPara("mes", e.ciclo); };
      jor.appendChild(it);
    });
    palco.appendChild(jor);
    palco.appendChild(el('<p class="pf-resultado">' + esc(d.resultado_jornada) + '</p>'));
    window.scrollTo(0, 0);
  }

  function telaMes(d, ciclo) {
    var c = (d.ciclos || []).filter(function (x) { return x.ciclo === ciclo; })[0];
    var e = (d.etapas || []).filter(function (x) { return x.ciclo === ciclo; })[0] ||
            { nome: ciclo, situacao: "Na sequência" };
    palco.appendChild(tituloPag(e.situacao, esc(e.nome), ""));
    var card = el('<div class="p-caixa" style="background:var(--branco);border:1px solid var(--linha);' +
      'border-radius:var(--r);padding:26px 28px;box-shadow:var(--sombra)"></div>');
    if (c && c.objetivo) {
      card.appendChild(el('<div class="pf-obj" style="margin:0 0 18px"><b>Objetivo desta etapa</b>' +
        esc(c.objetivo) + '</div>'));
    }
    var ent = (c && c.entregas) || [];
    if (!ent.length) {
      card.appendChild(el('<p class="pf-vazio">Esta etapa ainda está sendo construída com você.</p>'));
    }
    ent.forEach(function (x) {
      card.appendChild(el('<div class="pf-entrega ' + (x.feito ? "ok" : "") + '">' +
        '<span class="pf-check">' + (x.feito ? "✓" : "") + '</span><span>' + esc(x.titulo) + '</span>' +
        (x.pilar ? '<span class="pf-pilar">' + esc(x.pilar) + '</span>' : '') + '</div>'));
    });
    if (c && c.documentos) {
      card.appendChild(el('<p class="small muted" style="margin:16px 0 0">' + c.documentos +
        (c.documentos > 1 ? " documentos" : " documento") + " guardados nesta etapa</p>"));
    }
    palco.appendChild(card);
    window.scrollTo(0, 0);
  }

  var ECO = [
    ["Estratégia", "E", "e",
     "Define para quem a empresa existe, o que ela entrega e onde deve concentrar seus " +
     "esforços. É escolher uma direção clara para crescer com intenção, em vez de tentar " +
     "atender todo mundo e operar no improviso."],
    ["Condução", "C", "c",
     "Organiza o caminho desde o primeiro contato até a decisão do cliente. É a forma como " +
     "cada pessoa é recebida, orientada, acompanhada e conduzida, seja para uma compra, " +
     "contratação, consulta, procedimento ou projeto."],
    ["Operação", "O", "o",
     "Transforma a estratégia e a condução em uma rotina que funciona. Envolve processos " +
     "claros, responsabilidades definidas, indicadores acompanhados e uma equipe preparada " +
     "para executar sem depender o tempo todo da liderança."]
  ];

  function telaEco(d) {
    palco.appendChild(tituloPag("Método ECO", 'Os três <em class="grifo">pilares</em>',
      "O método que orienta cada etapa da implementação da sua operação."));
    var g = el('<div class="pf-eco-grid"></div>');
    ECO.forEach(function (x) {
      g.appendChild(el('<div class="pf-eco-c ' + x[2] + '"><span class="pf-eco-l">' + x[1] +
        '</span><h3>' + esc(x[0]) + '</h3><p>' + esc(x[3]) + '</p></div>'));
    });
    palco.appendChild(g);
    window.scrollTo(0, 0);
  }

  function telaEvolucao(d) {
    palco.appendChild(tituloPag("Minha evolução", 'O que sua operação <em class="grifo">já construiu</em>',
      "Cada conquista registra uma nova capacidade que passou a fazer parte da rotina da sua empresa."));
    var feitas = (d.conquistas || []).slice();
    palco.appendChild(el('<div class="pf-ribbon"><div><div class="eyebrow" ' +
      'style="color:var(--ouro-300)">Leitura da sua jornada</div>' +
      '<h3>Clareza construída em camadas.</h3><p>Cada conquista representa uma parte da estrutura ' +
      'comercial que passou a existir, ser compreendida ou fazer parte da rotina.</p></div>' +
      '<div class="pf-evo-stats"><div class="pf-evo-stat"><strong>03</strong><span>PILARES ECO</span></div>' +
      '<div class="pf-evo-stat"><strong>' + (d.etapas || []).length + '</strong><span>ETAPAS DA JORNADA</span></div>' +
      '<div class="pf-evo-stat"><strong>' + feitas.length + '</strong><span>CONQUISTAS LIBERADAS</span></div>' +
      '<div class="pf-evo-stat"><strong>' + (d.etapas || []).filter(function (e) {
        return e.situacao === "Concluída"; }).length + '</strong><span>ETAPAS CONCLUÍDAS</span></div>' +
      '</div></div>'));
    var lista = el('<div class="pf-ach-grid"></div>');
    if (!feitas.length) {
      lista.appendChild(el('<p class="pf-vazio">As primeiras conquistas aparecem assim que a ' +
        'construção começar.</p>'));
    }
    var romanos = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
    feitas.forEach(function (m, i) {
      lista.appendChild(el('<div class="pf-ach"><div class="selo">' + (romanos[i] || "•") +
        '</div><h3>' + esc(m.titulo) + '</h3><p>' + esc(m.texto) + '</p>' +
        '<time>' + dataCurta(m.em) + '</time></div>'));
    });
    palco.appendChild(lista);
    if (d.proxima_conquista) {
      palco.appendChild(el('<div class="pf-prox-card"><div class="selo">' +
        (romanos[feitas.length] || "•") + '</div><div><span class="eyebrow" ' +

  /* --------------------------------------------------------- upload ---- */
  var PEDACO = 4 * 1024 * 1024;
  function lerPedaco(blob) {
    return new Promise(function (ok, falha) {
      var fr = new FileReader();
      fr.onerror = function () { falha(new Error("Não consegui ler o arquivo.")); };
      fr.onload = function () { ok(fr.result); };
      fr.readAsDataURL(blob);
    });
  }
  /* arquivo grande vai em pedaços: cada um sobe sozinho, o servidor encaixa no disco */
  function enviarArquivoPortal(file, aoProgredir) {
    var envio = "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    var total = Math.max(1, Math.ceil(file.size / PEDACO));
    var i = 0;
    function proximo() {
      if (i >= total) return Promise.reject(new Error("Envio incompleto."));
      var ini = i * PEDACO;
      return lerPedaco(file.slice(ini, ini + PEDACO)).then(function (dados) {
        return fetch("/api/c/" + encodeURIComponent(token) + "/recado-pedaco", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ envio_id: envio, indice: i, total: total, dados: dados,
            nome: file.name, tipo: file.type })
        }).then(function (r) { return r.json(); });
      }).then(function (r) {
        if (r.erro) throw new Error(r.erro);
        i++;
        if (aoProgredir) aoProgredir(Math.round(i / total * 100));
        return r.pronto ? r : proximo();
      });
    }
    return proximo();
  }

              'style="display:inline-flex;align-items:center;gap:10px;padding:13px 18px;' +
              'background:var(--creme-2);border:1px solid var(--linha);border-radius:var(--r-sm);' +
              'text-decoration:none;color:var(--ameixa-800);font-size:14.5px;margin:0 0 16px">' +
              '<span style="color:var(--ouro-700);font-size:17px">⇩</span>' +
              esc(ct.titulo || (nome && nome.nome) || "Abrir arquivo") + '</a>'));
          } else if (b.tipo === "video" && (ct.url || ct.midia_id)) {
            var vd;
            if (ct.midia_id) {
              vd = el('<video controls style="width:100%;border-radius:var(--r);background:#000" ' +
                'src="/api/midia/' + esc(ct.midia_id) + '"></video>');
            } else {
              var yt = ct.url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{6,})/);
              var vm = ct.url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
              var src = yt ? "https://www.youtube.com/embed/" + yt[1]
                      : vm ? "https://player.vimeo.com/video/" + vm[1] : ct.url;
              vd = el('<div class="pf-emb"><iframe src="' + esc(src) + '" allowfullscreen loading="lazy"></iframe></div>');
            }
            var cxv = el('<figure style="margin:0 0 20px"></figure>');
            cxv.appendChild(vd);
            if (ct.titulo || ct.duracao) {
              cxv.appendChild(el('<figcaption style="margin-top:8px;font-size:14.5px;' +
                'color:var(--ameixa-900)"><strong>' + esc(ct.titulo || "") + '</strong>' +
                (ct.duracao ? '<span class="small muted">  ·  ' + esc(ct.duracao) + '</span>' : '') +
                '</figcaption>'));
            }
            if (ct.descricao) {
              cxv.appendChild(el('<div class="small muted" style="margin-top:3px">' + esc(ct.descricao) + '</div>'));
            }
            palco.appendChild(cxv);
          } else if (b.tipo === "audio" && ct.midia_id) {
            palco.appendChild(el('<div style="margin:0 0 18px">' +
              (ct.titulo ? '<div style="font-size:14.5px;color:var(--ameixa-900);margin-bottom:6px">' +
                esc(ct.titulo) + '</div>' : '') + '<audio controls style="width:100%" src="/api/midia/' +
              esc(ct.midia_id) + '"></audio></div>'));
          } else if (b.tipo === "imagem" && ct.midia_id) {
            palco.appendChild(el('<figure style="margin:0 0 18px"><img src="/api/midia/' +
              esc(ct.midia_id) + '" alt="" style="max-width:100%;border-radius:var(--r);' +
              'border:1px solid var(--linha)">' + (ct.legenda ? '<figcaption class="small muted" ' +
              'style="margin-top:7px">' + esc(ct.legenda) + '</figcaption>' : '') + '</figure>'));
          } else if (b.tipo === "arquivo" && ct.midia_id) {
            palco.appendChild(el('<a href="/api/midia/' + esc(ct.midia_id) + '" target="_blank" ' +
              'style="display:inline-flex;align-items:center;gap:10px;padding:13px 18px;' +
              'background:var(--creme-2);border:1px solid var(--linha);border-radius:var(--r-sm);' +
              'text-decoration:none;color:var(--ameixa-800);font-size:14.5px;margin:0 0 16px">' +
              '<span style="color:var(--ouro-700);font-size:17px">⇩</span>' +
              esc(ct.titulo || "Abrir arquivo") + '</a>'));
          } else if (b.tipo === "link" && ct.url) {
            palco.appendChild(el('<a href="' + esc(ct.url) + '" target="_blank" rel="noopener" ' +
              'style="display:block;padding:15px 18px;border:1px solid var(--linha);' +
              'border-radius:var(--r-sm);text-decoration:none;margin:0 0 16px">' +
              '<strong style="color:var(--ameixa-800);font-size:15px">' + esc(ct.titulo || ct.url) +
              '</strong>' + (ct.descricao ? '<div class="small muted" style="margin-top:3px">' +
              esc(ct.descricao) + '</div>' : '') + '</a>'));
          }
        });
        window.scrollTo(0, 0);
      });
  }

  function carregar(silencioso) {
    if (!silencioso) {
      palco.innerHTML = '<p class="muted" style="text-align:center;padding:60px 0">Carregando…</p>';
    }
    fetch("/api/c/" + encodeURIComponent(token)).then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.erro) return erro(d.erro);
        DADOS = d;
        montarCasca(d);
        if (silencioso && ONDE === "conversa") {
          palco.innerHTML = "";
          marcarNavAtiva("conversa");
          palco.appendChild(volta());
          telaConversa(d);
          return;
        }
        desenhar(d);
      }).catch(function () { erro("Não foi possível carregar agora. Tente daqui a pouco."); });
  }
  carregar();
})();

/* troca o simbolo desenhado pelo logo enviado pela B3 Sales, quando existir */
fetch("/api/marca").then(function (r) { return r.json(); }).then(function (m) {
  if (!m.logo_midia_id) return;
  document.querySelectorAll(".marca").forEach(function (el) {
    el.innerHTML = '<img class="marca-img" src="/api/midia/' + m.logo_midia_id + '" alt="Grupo B3 Sales">';
  });
}).catch(function () {});
</script>
</body>
