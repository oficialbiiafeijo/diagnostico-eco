<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Diagnóstico Comercial ECO · Grupo B3 Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  .topo{position:sticky;top:0;z-index:60;background:rgba(250,243,236,.88);
    backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--linha)}
  .topo-in{max-width:940px;margin:0 auto;padding:14px 24px;display:flex;
    align-items:center;justify-content:space-between;gap:16px}
  .topo-prog{flex:1;max-width:340px}
  .topo-prog .linha{display:flex;justify-content:space-between;font-size:11px;
    color:var(--muted);margin-bottom:6px;letter-spacing:.06em}
  .palco{max-width:940px;margin:0 auto;padding:38px 24px 120px}

  /* boas-vindas */
  .hero{text-align:center;padding:26px 0 6px}
  .hero h1{font-size:clamp(38px,6vw,62px);margin:16px 0 10px;color:var(--ameixa-900)}
  .hero .sub{font-size:16px;color:var(--texto-2);max-width:60ch;margin:0 auto 30px}
  .pilares{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:14px;margin:34px 0}
  .pilar{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);
    padding:22px 20px;text-align:left;position:relative;overflow:hidden}
  .pilar::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--ouro-600),transparent)}
  .pilar .letra{font-family:var(--serif);font-size:44px;line-height:1;
    color:var(--ouro-500);opacity:.9}
  .pilar h3{font-size:22px;margin:4px 0 6px;color:var(--ameixa-900)}
  .pilar p{font-size:13px;color:var(--texto-2);margin:0}
  .fatos{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  .fato{text-align:center}
  .fato b{display:block;font-family:var(--serif);font-size:30px;color:var(--ameixa-900);
    font-weight:500}
  .fato span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* blocos */
  .bloco-cab{margin-bottom:26px}
  .bloco-cab h2{font-size:clamp(30px,4.6vw,44px);color:var(--ameixa-900);margin:8px 0 8px}
  .bloco-cab p{font-size:15px;color:var(--texto-2);max-width:64ch;margin:0}
  .pergunta{padding:26px 0;border-top:1px solid var(--linha)}
  .pergunta:first-child{border-top:0;padding-top:6px}
  .num-q{font-family:var(--serif);font-size:13px;color:var(--ouro-700);
    letter-spacing:.1em;display:block;margin-bottom:2px}
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;
    padding-top:24px;border-top:1px solid var(--linha);flex-wrap:wrap}
  .trilha{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:30px}
  .trilha button{font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:7px 13px;border-radius:999px;border:1px solid var(--linha-2);cursor:pointer;
    background:rgba(255,255,255,.55);color:var(--muted);font-family:var(--sans);
    transition:all .15s}
  .trilha button:hover{border-color:var(--ouro-500);color:var(--ameixa-800)}
  .trilha button.at{background:var(--ameixa-900);color:#fff;border-color:transparent}
  .trilha button.ok{color:var(--ok);border-color:rgba(62,125,90,.35)}
  .trilha button.at.ok{color:#fff}

  /* revisao */
  .rev-bloco{margin-bottom:12px;border:1px solid var(--linha);border-radius:var(--r);
    background:var(--branco);overflow:hidden}
  .rev-cab{display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:16px 20px;cursor:pointer;background:linear-gradient(90deg,
    rgba(243,233,225,.7),transparent)}
  .rev-cab h3{font-size:21px;color:var(--ameixa-900)}
  .rev-lista{padding:4px 20px 18px;display:none}
  .rev-bloco.aberto .rev-lista{display:block}
  .rev-item{padding:13px 0;border-top:1px solid var(--linha)}
  .rev-item .p{font-size:13px;color:var(--muted);margin-bottom:3px}
  .rev-item .r{font-size:14.5px;color:var(--texto);white-space:pre-wrap}
  .rev-item .r.vazio{color:#C0B2C6;font-style:italic}

  /* conclusao */
  .fim{text-align:center;padding:40px 0}
  .fim .selo-ok{width:82px;height:82px;border-radius:50%;margin:0 auto 26px;
    display:grid;place-items:center;font-size:34px;
    background:linear-gradient(135deg,var(--ouro-300),var(--ouro-600));
    box-shadow:0 18px 40px -18px rgba(160,120,50,.9)}
  .fim h1{font-size:clamp(34px,5.4vw,52px);color:var(--ameixa-900);margin-bottom:16px}
  .fim p{font-size:15.5px;color:var(--texto-2);max-width:60ch;margin:0 auto 16px}
  .fim .bora{font-family:var(--serif);font-size:clamp(24px,3.6vw,32px);
    color:var(--ameixa-900);margin:30px 0 8px}
  .rodape{text-align:center;padding:30px 24px 40px;color:var(--muted);font-size:11.5px;
    letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div class="topo">
  <div class="topo-in">
    <div class="marca">
      <span class="marca-b3"><svg viewBox="0 0 58 56" aria-label="B3 Sales Group"><text class="mb" x="0" y="47">B</text><text class="m3" x="17" y="47">3</text></svg></span><span class="marca-fio"></span>
      <div><div class="marca-txt">Sales</div><div class="marca-sub">Group</div></div>
    </div>
    <div class="topo-prog hidden" id="topoProg">
      <div class="linha"><span id="progRot">Progresso</span><span id="progPct">0%</span></div>
      <div class="progresso-trilho"><div class="progresso-barra" id="progBarra" style="width:0"></div></div>
    </div>
  </div>
</div>
<main class="palco" id="palco"></main>
<div class="rodape">Diagnóstico Comercial ECO · Grupo B3 Sales</div>
<div class="toast" id="toast"><span class="pt"></span><span id="toastTxt">Salvo</span></div>
<script src="/static/cliente.js"></script>
<script>
/* troca o simbolo desenhado pelo logo enviado pela B3 Sales, quando existir */
fetch("/api/marca").then(function (r) { return r.json(); }).then(function (m) {
  if (!m.logo_midia_id) return;
  document.querySelectorAll(".marca").forEach(function (el) {
    el.innerHTML = '<img class="marca-img" src="/api/midia/' + m.logo_midia_id +
      '" alt="Grupo B3 Sales">';
  });
}).catch(function () {});
</script>
</body>
</html>
